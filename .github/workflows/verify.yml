name: Verify foundation
on:
  push:
    branches: [development]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test-only-ci
          POSTGRES_DB: lumiere_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d lumiere_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://test:test-only-ci@localhost:5432/lumiere_test
      TEST_DATABASE_URL: postgresql://test:test-only-ci@localhost:5432/lumiere_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
      - run: npm run db:migrate
      - run: npm test
