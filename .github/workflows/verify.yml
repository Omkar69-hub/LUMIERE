name: Verify foundation
on:
  push:
    branches: [development]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test-only-ci
          POSTGRES_DB: lumiere_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d lumiere_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://test:test-only-ci@localhost:5432/lumiere_test
      TEST_DATABASE_URL: postgresql://test:test-only-ci@localhost:5432/lumiere_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
      - run: npm run db:migrate
      - run: npm test
      - name: Install Chromium for browser QA
        run: npx playwright install --with-deps chromium
      - name: Browser authentication and navigation tests
        env:
          APP_ORIGIN: http://localhost:5173
          PORT: 3001
        run: npm run test:browser
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - name: Audit production and development dependencies
        run: npm audit --audit-level=high
