services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: lumiere
      POSTGRES_USER: lumiere
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumiere -d lumiere"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
